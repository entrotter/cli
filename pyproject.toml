[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entrotter-cli"
version = "0.1.0"
description = "Command-line tools for Entrotter experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Entrotter contributors"}]
dependencies = ["entrotter-sdk==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
entrotter = "entrotter_cli.main:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
mypy_path = "typings"
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
